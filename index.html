<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Викторина</title>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/player.css">
</head>
<body class="role-unknown">

    <div id="screen-login" class="screen">
        <form class="login-box" id="login-form" autocomplete="on">
            <h1 class="login-title">Вход в игру</h1>
            <p class="login-error" id="login-error" role="alert"></p>
            <!-- Имя, а не почта. Адрес для Supabase собирается из имени в
                 Quiz.auth.loginFor() и наружу не показывается никогда.
                 Поле обязано быть type="text": type="email" не пропустит
                 «Алина» дальше проверки формы. Вписать адрес целиком тоже
                 можно — это запасная дверь для аккаунтов, заведённых до
                 этой конвенции. -->
            <input type="text"     id="login-name" class="login-input" placeholder="Имя" autocomplete="username" required>
            <input type="password" id="login-password" class="login-input" placeholder="Пароль" autocomplete="current-password" required>
            <button type="submit" class="login-submit" id="login-submit">Войти</button>
        </form>
    </div>

    <div id="screen-game" class="screen" hidden>
        <aside class="sidebar">
            <!-- Единственное «добавить»: заводит вход, с которым человек
                 сядет за свой телефон. В игру он попадёт сам. -->
            <button class="btn-add-player admin-only" id="btn-add-account"
                    title="Завести игроку вход: почта и пароль">+ Аккаунт</button>
            <div class="players-scroll" id="players-list"></div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="admin-controls admin-only">
                    <select class="select-game" id="select-game" title="Активная игра"></select>
                    <button class="btn" id="btn-new-game" title="Создать игру">+ Игра</button>
                    <input type="file" id="input-xlsx" accept=".xlsx,.xls" hidden>
                    <label for="input-xlsx" class="btn">Загрузить</label>
                    <button class="btn" id="btn-toggle-answer">Ответ</button>
                    <button class="btn" id="btn-toggle-stats">Показать статистику</button>
                    <button class="btn" id="btn-toggle-sounds" title="Звуки: файлы, громкость, кому что играет">Звуки</button>
                    <button class="btn" id="btn-reset-penalties" title="Обнулить ожидание у всех">Сброс ⏱</button>
                    <button class="btn" id="btn-restart">Сброс игры</button>
                    <button class="btn btn-circle" id="btn-intro" title="Проиграть интро">🎵</button>
                    <!-- Стрелки последние: за ними ведущий тянется чаще
                         всего, а край строки — самое короткое движение. -->
                    <button class="btn btn-circle" id="btn-prev" title="Предыдущий вопрос">◀</button>
                    <button class="btn btn-circle" id="btn-next" title="Следующий вопрос">▶</button>
                </div>

                <div class="header-actions">
                    <div class="status admin-only" id="status-text"></div>
                    <div class="volume-control" title="Громкость">
                        <span class="volume-icon">🔊</span>
                        <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="100">
                    </div>
                    <!-- Под кем вошли. Только у игрока: у ведущего экран и
                         так его собственный, а шапка и без того плотная. -->
                    <div class="my-name player-only" id="my-name"></div>
                    <button class="btn" id="btn-logout">Выйти</button>
                </div>
            </header>

            <!-- Панель звуков — только ведущему и только на его
                 устройстве: флага в базе у неё нет, игроки о ней не
                 знают. Стоит первой из трёх: правила в admin.css гасят
                 всё, что НИЖЕ открытой панели, поэтому порядок здесь
                 задаёт старшинство — звуки, статистика, вопрос. -->
            <div class="sounds-view admin-only" id="sounds-view" hidden>
                <div class="sounds-box">
                    <div class="sounds-head">
                        <div class="stats-title">Звуки</div>
                        <input type="file" id="input-sound" accept="audio/*" hidden>
                        <label for="input-sound" class="btn">Залить звук</label>
                        <button class="btn" id="btn-sounds-close">Закрыть</button>
                    </div>
                    <div class="sounds-scroll">
                        <div class="sounds-group">Файлы</div>
                        <div id="sounds-list"></div>
                        <div class="sounds-group">Кому что играет</div>
                        <div id="sounds-players"></div>
                    </div>
                </div>
            </div>

            <!-- Статистика. Одна разметка на обе роли и без классов роли:
                 показана она или нет, решает флаг show_stats в строке
                 game. Ведущему она встаёт ВМЕСТО вопроса — накрывать ему
                 экран нельзя, под слоем осталась бы и кнопка, которой
                 его закрывают. Игроку — слоем поверх всего, там закрывает
                 ведущий. -->
            <div class="stats-view" id="stats-view" hidden>
                <div class="stats-box">
                    <div class="stats-title">Статистика игры</div>
                    <div class="stats-scroll">
                        <table class="stats-table">
                            <thead>
                                <tr>
                                    <th class="stats-name">Игрок</th>
                                    <th>−1</th>
                                    <th>0</th>
                                    <th>+1</th>
                                    <th>+2</th>
                                    <th class="stats-score">Очки</th>
                                </tr>
                            </thead>
                            <tbody id="stats-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <section class="question-area" id="question-area">
                <div class="question-text" id="question-text"></div>
                <img class="media" id="question-image" alt="" hidden>

                <!-- Показ решает база, а не разметка: ведущему строка
                     question_answer доступна всегда, игроку — только после
                     «Ответ». Класса роли здесь быть не должно, иначе правило
                     окажется записанным в двух местах и разъедется. -->
                <div class="answer-preview" id="answer-preview" hidden>
                    <div class="answer-preview-title">Ответ</div>
                    <div class="answer-text" id="answer-text"></div>
                    <img class="media" id="answer-image" alt="" hidden>
                </div>
            </section>

            <!-- Кнопка объявлена заблокированной: до первой отрисовки про
                 кулдаун ничего не известно, а разрешать нажатие раньше,
                 чем узнали, нельзя. Подпись и доступность дальше ведёт
                 js/ui/buzzer.js, здесь только состояние покоя. -->
            <div class="action-area player-only">
                <button class="btn-buzzer" id="btn-buzzer" disabled>ОЖИДАНИЕ</button>
            </div>
        </main>
    </div>

    <!-- ================================================================
         Сторонние библиотеки. Обе — классические скрипты, выставляющие
         глобальные объекты (window.supabase, window.XLSX), поэтому
         работают и с file://.
         ================================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- ================================================================
         Свои скрипты. ES-модулей здесь нет (страница должна открываться
         с file://), поэтому ПОРЯДОК ПОДКЛЮЧЕНИЯ ЗНАЧИМ: сначала
         фундамент, потом то, что на него опирается, main.js последним.
         Каждый файл дописывает свою часть в единый глобальный объект Quiz.
         ================================================================ -->
    <script src="js/namespace.js"></script>
    <script src="js/config.js"></script>
    <script src="js/dom.js"></script>
    <script src="js/db.js"></script>
    <script src="js/store.js"></script>
    <script src="js/timing.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/excel.js"></script>
    <script src="js/game.js"></script>
    <script src="js/buzzer.js"></script>
    <script src="js/realtime.js"></script>
    <script src="js/ui/login.js"></script>
    <script src="js/ui/admin.js"></script>
    <script src="js/ui/players.js"></script>
    <script src="js/ui/question.js"></script>
    <script src="js/ui/buzzer.js"></script>
    <script src="js/ui/stats.js"></script>
    <script src="js/ui/sounds.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
